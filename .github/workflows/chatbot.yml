name: Chatbot

permissions:
  contents: write

on:
  push:
    paths:
      - inbox.json

jobs:
  reply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read inbox
        id: inbox
        run: |
          MSG=$(cat inbox.json | jq -r '.message')
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Generate reply
        id: reply
        run: |
          MSG="${{ steps.inbox.outputs.msg }}"

          if [[ "$MSG" == *"hello"* ]]; then
            REPLY="Hi there from GitHub Actions!"
          elif [[ "$MSG" == *"how are you"* ]]; then
            REPLY="I'm just a workflow, but I'm running fine."
          else
            REPLY="You said: $MSG"
          fi

          cat <<EOF > outbox.json
          {
            "reply": "$REPLY"
          }
          EOF

      - name: Commit reply
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add outbox.json
          git commit -m "bot reply" || echo "No changes to commit"
          git push
