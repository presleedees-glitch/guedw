name: Guessing Game

permissions:
  contents: write

on:
  push:
    paths:
      - inbox.json

jobs:
  play:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read player guess
        id: read_guess
        run: |
          GUESS=$(cat inbox.json | jq -r '.guess')
          echo "guess=$GUESS" >> $GITHUB_OUTPUT

      - name: Load or create secret number
        id: secret
        run: |
          if [ -f secret.json ]; then
            NUM=$(cat secret.json | jq -r '.number')
          else
            NUM=$(( (RANDOM % 100) + 1 ))
            echo "{\"number\": $NUM}" > secret.json
          fi
          echo "number=$NUM" >> $GITHUB_OUTPUT

      - name: Compute result
        id: result
        run: |
          GUESS="${{ steps.read_guess.outputs.guess }}"
          NUM="${{ steps.secret.outputs.number }}"

          if [ -z "$GUESS" ] || [ "$GUESS" = "null" ]; then
            MSG="No guess yet. Enter a number between 1 and 100."
            STATUS="waiting"
          elif [ "$GUESS" -lt "$NUM" ]; then
            MSG="Too low! Try a higher number."
            STATUS="higher"
          elif [ "$GUESS" -gt "$NUM" ]; then
            MSG="Too high! Try a lower number."
            STATUS="lower"
          else
            MSG="Correct! The number was $NUM. Game reset, guess again!"
            STATUS="correct"
            # reset secret for a new game
            NEW=$(( (RANDOM % 100) + 1 ))
            echo "{\"number\": $NEW}" > secret.json
          fi

          cat <<EOF > outbox.json
          {
            "message": "$MSG",
            "lastGuess": $GUESS,
            "status": "$STATUS"
          }
          EOF

      - name: Commit game state
        run: |
          git config user.name "game-bot"
          git config user.email "game-bot@example.com"
          git add outbox.json secret.json
          git commit -m "Update game state" || echo "No changes to commit"
          git push
