name: Chatbot

permissions:
  contents: write

on:
  push:
    paths:
      - inbox.json

jobs:
  reply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read inbox
        id: inbox
        run: |
          MSG=$(cat inbox.json | jq -r '.message')
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Generate reply
        run: |
          MSG="${{ steps.inbox.outputs.msg }}"

          if [[ "$MSG" == *"hello"* ]]; then
            REPLY="Hi there!"
          elif [[ "$MSG" == *"how are you"* ]]; then
            REPLY="I'm running inside GitHub Actions, so I'm doing great."
          else
            REPLY="You said: $MSG"
          fi

          echo "{\"reply\": \"$REPLY\"}" > outbox.json

      - name: Commit reply
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"

          # Stage changes BEFORE pulling
          git add outbox.json || true

          # Pull safely with autostash to avoid unstaged-change errors
          git pull --rebase --autostash

          # Stage again after rebase
          git add outbox.json

          # Commit safely
          git commit -m "bot reply" || echo "No changes to commit"

          # Push final result
          git push
