<!DOCTYPE html>
<html>
<head>
  <title>GitHub Actions Chatbot</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; padding:20px; }
    #chat { border:1px solid #444; padding:10px; height:300px; overflow-y:auto; }
    input { width:70%; padding:10px; }
    button { padding:10px; }
    .you { color:#4fd; }
    .bot { color:#fd4; }
  </style>
</head>
<body>

<h2>GitHub Actions Chatbot</h2>
<div id="chat"></div>

<input id="msg" placeholder="Say something...">
<button onclick="send()">Send</button>

<script>
const repo = "presleedees-glitch/guedw";
const branch = "main";

function add(text, cls) {
  const c = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

async function send() {
  const text = document.getElementById("msg").value;
  if (!text) return;
  add("You: " + text, "you");
  add("Bot: thinking...", "bot");

  // You manually update inbox.json in GitHub to trigger the bot.
  alert("Now go edit inbox.json in GitHub and set message to: " + text);

  // Poll for reply
  for (let i = 0; i < 20; i++) {
    const res = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/outbox.json?cache=${Date.now()}`);
    const data = await res.json();
    if (data.reply && data.reply !== "pending") {
      add("Bot: " + data.reply, "bot");
      return;
    }
    await new Promise(r => setTimeout(r, 2000));
  }

  add("Bot: no reply yet", "bot");
}
</script>

</body>
</html>
