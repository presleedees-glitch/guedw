<!DOCTYPE html>
<html>
<head>
  <title>GitHub Actions Guessing Game</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; text-align:center; padding-top:40px; }
    input { padding:8px; font-size:16px; }
    button { padding:8px 12px; font-size:16px; margin-left:4px; }
    #log { margin-top:20px; }
  </style>
</head>
<body>
  <h1>Guess the Number (via GitHub Actions)</h1>
  <p id="status">Loading game...</p>

  <input id="guessInput" type="number" placeholder="Enter a number 1-100">
  <button onclick="sendGuess()">Guess</button>

  <div id="log"></div>

<script>
const repo = "YOUR_USERNAME/YOUR_REPO";
const branch = "main";
const token = "YOUR_GITHUB_TOKEN"; // or use a backend proxy instead of exposing this

async function fetchState() {
  const res = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/outbox.json?cachebust=${Date.now()}`);
  const data = await res.json();
  document.getElementById("status").innerText = data.message;
  if (data.lastGuess !== null) {
    addLog(`Last guess: ${data.lastGuess} → ${data.status}`);
  }
}

async function sendGuess() {
  const val = document.getElementById("guessInput").value;
  if (!val) return;

  addLog(`You guessed: ${val}`);

  // write guess to inbox.json via GitHub API
  const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/inbox.json?ref=${branch}`);
  const file = await getRes.json();

  const newContent = btoa(JSON.stringify({ guess: Number(val) }, null, 2));

  await fetch(`https://api.github.com/repos/${repo}/contents/inbox.json`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({
      message: "player guess",
      content: newContent,
      sha: file.sha,
      branch
    })
  });

  // wait a bit, then fetch updated game state
  setTimeout(fetchState, 4000);
}

function addLog(text) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.textContent = text;
  log.appendChild(div);
}

fetchState();
</script>
</body>
</html>
